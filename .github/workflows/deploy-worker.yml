name: Deploy fulfillment worker

# Deploys worker/ to Cloudflare Workers automatically — no manual paste, no
# Cloudflare "Connect to Git" flow. Runs on GitHub's servers, not your phone.
#
# Requires these to already exist as repository secrets (Settings > Secrets
# and variables > Actions) before this will succeed:
#   CLOUDFLARE_API_TOKEN   - lets this workflow deploy to your Cloudflare account
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET  - can be added later, once the webhook exists
#   RESEND_API_KEY
#   ANTHROPIC_API_KEY
#   TWILIO_ACCOUNT_SID     - can be added later, once you set up Twilio for SMS alerts
#   TWILIO_AUTH_TOKEN      - same
#   TWILIO_FROM_NUMBER     - same
# A secret with no value set in GitHub is skipped (not deployed as empty, and
# not an error) -- whatever is already set on Cloudflare, including a value
# fixed there by hand, is left alone. To actually push a new/changed value for
# one of these, update it in GitHub Actions secrets, then re-run this workflow
# (Actions tab -> this workflow -> "Re-run jobs", no new commit needed) --
# editing it only in the Cloudflare dashboard works until the next deploy,
# which would otherwise silently fall back to whatever (or nothing) GitHub has.

on:
  push:
    branches: ["claude/starchart13-stripe-link-z5wgnl", "main"]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # Only pushes a secret here if GitHub actually has a non-empty value for it --
      # otherwise this step would silently overwrite a value someone fixed directly
      # in the Cloudflare dashboard (confirmed in production: a later deploy reverted
      # a manually-corrected ANTHROPIC_API_KEY back to the stale GitHub-side value,
      # because GitHub's copy was never updated to match). Skipping blind ones means
      # GitHub and Cloudflare can only ever disagree by GitHub being behind, never by
      # a deploy actively undoing a fix made on the Cloudflare side.
      - name: Set secrets on the deployed worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        run: |
          set_if_present() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "Skipping $name -- no value set in GitHub Actions secrets (leaving Cloudflare's current value untouched)"
            fi
          }
          set_if_present STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          set_if_present STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          set_if_present RESEND_API_KEY "$RESEND_API_KEY"
          set_if_present ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          set_if_present TWILIO_ACCOUNT_SID "$TWILIO_ACCOUNT_SID"
          set_if_present TWILIO_AUTH_TOKEN "$TWILIO_AUTH_TOKEN"
          set_if_present TWILIO_FROM_NUMBER "$TWILIO_FROM_NUMBER"
